name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ios-ui]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Tools (Morphe CLI, APKEditor)
        run: |
          mkdir -p tools
          curl -sSL -o tools/morphe-desktop-2.0.0-all.jar https://github.com/MorpheApp/morphe-desktop/releases/download/v2.0.0/morphe-desktop-2.0.0-all.jar
          curl -sSL -o tools/APKEditor-1.4.9.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar

      - name: Download Instagram (APKPure)
        run: |
          curl -sSL -A "Mozilla/5.0 (Linux; Android 14)" -o instagram.xapk \
            "https://d.apkpure.com/b/XAPK/com.instagram.android?version=latest"
          unzip -p instagram.xapk manifest.json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['version_name'])" > ig_version.txt
          echo "Instagram $(cat ig_version.txt)"

      - name: Keystore
        env:
          KS: ${{ secrets.FEUR_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > feurstagram.keystore

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FEURSTAGRAM_KEYSTORE_PASS: ${{ secrets.FEUR_KEYSTORE_PASS }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          chmod +x gradlew build.sh
          ./build.sh instagram.xapk --clone
          mv feurstagram.apk RdxGram-ios-$(cat ig_version.txt).apk

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-test-${{ github.run_number }}"
          gh release create "$TAG" RdxGram-ios-*.apk --target "${{ github.sha }}" --prerelease \
            --title "RdxGram iOS test ${{ github.run_number }}" \
            --notes "Test build (clone: installs next to the official Instagram). Instagram $(cat ig_version.txt)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            RdxGram-ios-*.apk
            build/patch-report.json
